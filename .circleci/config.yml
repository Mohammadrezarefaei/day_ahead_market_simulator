version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
      - run:
          name: Run Unit Tests with Pytest
          command: |
            export PYTHONPATH=.
            pytest

workflows:
  test-workflow:
    jobs:
      - build-and-test
