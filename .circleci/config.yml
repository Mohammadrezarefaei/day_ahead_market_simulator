version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Setup Pip and Install Dependencies
          command: |
            python3 -m ensurepip --upgrade
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt
      - run:
          name: Run Unit Tests with Pytest
          command: |
            export PYTHONPATH=.
            python3 -m pytest

workflows:
  version: 2
  test-workflow:
    jobs:
      - build-and-test
