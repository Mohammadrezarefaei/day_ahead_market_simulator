version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Bootstrap pip and Install Dependencies
          command: |
            curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3 get-pip.py
            rm get-pip.py
            python3 -m pip install -r requirements.txt
      - run:
          name: Run Unit Tests with Pytest
          command: |
            export PYTHONPATH=.
            python3 -m pytest

workflows:
  version: 2
  test-workflow:
    jobs:
      - build-and-test
